<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EasyBuy — E-commerce Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css">
</head>
<body>

  <!-- Toast Notification -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Main Site Header -->
  <header id="siteHeader" class="site-head">
    <div class="wrap">
      <a href="#/" class="brand-logo"><i>E</i> EasyBuy</a>
      <nav class="nav-links">
        <a href="#/" data-nav="home">Home</a>
        <a href="#/dashboard" data-nav="dashboard">Dashboard</a>
        <button id="navAuth" class="btn small">Log in</button>
      </nav>
    </div>
  </header>

  <!-- Router Views -->
  <main>
    <!-- Home View -->
    <section id="v-home" data-view hidden>
      <div class="wrap" style="padding-top:40px; padding-bottom:40px">
        <div id="builderTop" class="builder-hero">
          <h1>Create your online store in seconds</h1>
          <p>Sell products easily across Pakistan with Cash on Delivery and WhatsApp ordering.</p>
          <form id="builder" class="builder-form" style="margin-top:20px; max-width:500px">
            <label>Store Name
              <input id="bName" type="text" placeholder="e.g. Urban Style" required>
            </label>
            <label>Category</label>
            <div id="bCats" class="chips" style="display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap"></div>
            <label>Theme Accent Colour</label>
            <div id="bColors" class="swatches" style="display:flex; gap:8px; margin-bottom:16px"></div>
            <label>WhatsApp Number
              <input id="bWa" type="tel" placeholder="03XXXXXXXXX">
            </label>
            <button class="btn primary big" type="submit">Create Store</button>
          </form>
        </div>

        <div style="margin-top:60px">
          <h2>Popular Stores</h2>
          <div id="storeList" style="margin-top:16px"></div>
        </div>
      </div>
    </section>

    <!-- Login View -->
    <section id="v-login" data-view hidden></section>

    <!-- Dashboard View -->
    <section id="v-dashboard" data-view hidden>
      <div class="wrap">
        <div id="dash"></div>
      </div>
    </section>

    <!-- Store View (Separate Browser View) -->
    <section id="v-store" data-view hidden></section>
  </main>

  <!-- Main Site Footer -->
  <footer id="siteFooter" style="border-top: 1px solid var(--line); padding: 24px 0; margin-top: 40px; text-align: center; color: var(--muted)">
    <div class="wrap">
      <p>&copy; 2026 EasyBuy Platform. Built for effortless online selling.</p>
    </div>
  </footer>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
